<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div> <i class="nf nf-md-view_dashboard"></i> Dashboard</div>
            <div>
                <ul>
                    <li><i class="nf nf-md-home"></i> Home</li>
                    <li><i class="nf nf-fa-address_card"></i> Profile</li>
                    <li><i class="nf nf-md-message_text"></i> Messages</li>
                    <li><i class="nf nf-md-clock"></i> History</li>
                    <li><i class="nf nf-fa-clipboard_list"></i> Tasks</li>
                    <li><i class="nf nf-md-account_group"></i> Communities</li>
                </ul>
            </div>
            <div>
                <ul>
                    <li><i class="nf nf-fa-cog"></i> Settings</li>
                    <li><i class="nf nf-fa-circle_question"></i> Support</li>
                    <li><i class="nf nf-md-shield_check"></i> Privacy</li>
                </ul>
            </div>
        </div>
        <div class="nav">
            <div><i class="nf nf-fa-search"></i> <input type="search"></div>
            <div>
                <i class="nf nf-md-bell_ring"></i><img src="" alt=""> <p>Morgan Oakley</p>
            </div>
            <div>
                <img src="" alt="">
                <p>Hi there, <span>Morgan Oakley (@morgan)</span></p>
            </div>
            <div><button>New</button><button>Upload</button><button>Share</button></div>
        </div>
        <div class="main-content"></div>
    </div>
    
</body>
</html>
